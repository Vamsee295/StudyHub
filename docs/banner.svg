<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="StudyHub: know what your company will ask">
  <!-- README banner. Paper & Ink (DESIGN.md): cream paper, ink, rust. CSS animation only, so it plays as an <img> on GitHub. -->
  <style>
    .ink{fill:#191614}.paper{fill:#f5efe6}.card{fill:#fbf8f2}.rust{fill:#c8603a}.teal{fill:#2f6f6a}.gold{fill:#e3a72f}
    .line{stroke:#191614;stroke-width:4;fill:none;stroke-linejoin:round}
    .display{font-family:Anton,Impact,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:.5px}
    .cond{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:700}
    .text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
    @keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
    @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
    @keyframes float3{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes read{0%{transform:scaleX(.05)}70%,100%{transform:scaleX(1)}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes tick{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-40}}
    .f1{animation:float1 6s ease-in-out infinite}
    .f2{animation:float2 7s ease-in-out infinite .6s}
    .f3{animation:float3 5.5s ease-in-out infinite 1.2s}
    .bar{transform-box:fill-box;transform-origin:left;animation:read 4.5s cubic-bezier(.6,0,.3,1) infinite}
    .caret{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:tick 2.4s ease-in-out infinite}
    .orbit{stroke-dasharray:6 14;animation:dash 3s linear infinite}
    @media (prefers-reduced-motion: reduce){.f1,.f2,.f3,.bar,.caret,.pulse,.orbit{animation:none}}
  </style>

  <!-- paper with a dot grid -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#191614" fill-opacity=".09"/></pattern>
  </defs>
  <rect width="1280" height="520" class="paper"/>
  <rect width="1280" height="520" fill="url(#dots)"/>

  <!-- left: the promise -->
  <g transform="translate(72 92)">
    <g transform="translate(0 0)">
      <rect x="4" y="4" width="64" height="64" rx="14" class="ink"/>
      <rect x="0" y="0" width="64" height="64" rx="14" class="card" stroke="#191614" stroke-width="4"/>
      <path d="M34 0h14v28l-7-5.6L34 28z" class="rust" stroke="#191614" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="11" y="12" width="17" height="6" rx="3" class="ink"/>
      <rect x="11" y="36" width="40" height="6" rx="3" class="ink"/>
      <rect x="11" y="48" width="40" height="6" rx="3" class="ink" fill-opacity=".18"/>
      <rect x="11" y="48" width="22" height="6" rx="3" class="rust"/>
    </g>
    <text x="84" y="49" class="display ink" font-size="44" textLength="112" lengthAdjust="spacingAndGlyphs">STUDY</text>
    <g transform="translate(206 8) rotate(-2)">
      <rect width="92" height="54" rx="8" class="rust"/>
      <text x="12" y="44" class="display paper" font-size="44" textLength="68" lengthAdjust="spacingAndGlyphs">HUB</text>
    </g>

    <text x="0" y="150" class="display ink" font-size="76" textLength="360" lengthAdjust="spacingAndGlyphs">KNOW WHAT</text>
    <g transform="translate(-6 166) rotate(-1.5)">
      <rect width="452" height="86" rx="12" class="rust"/>
      <text x="18" y="72" class="display paper" font-size="76" textLength="416" lengthAdjust="spacingAndGlyphs">YOUR COMPANY</text>
    </g>
    <text x="0" y="330" class="display ink" font-size="76" textLength="300" lengthAdjust="spacingAndGlyphs">WILL ASK.</text>
    <text x="0" y="378" class="text ink" font-size="20" fill-opacity=".78">Placement prep for engineering students: the rounds, the subjects,</text>
    <text x="0" y="406" class="text ink" font-size="20" fill-opacity=".78">the order to learn them, and practice on the same questions.</text>
  </g>

  <!-- right: a 3D deck of three StudyHub screens, each floating on its own beat -->
  <g transform="translate(720 112) scale(.84) skewY(-6) rotate(-4)">
    <!-- back: code problem -->
    <g class="f3">
      <g transform="translate(150 6)">
        <rect x="10" y="10" width="360" height="230" rx="18" class="ink"/>
        <rect width="360" height="230" rx="18" fill="#151311" stroke="#191614" stroke-width="4"/>
        <circle cx="26" cy="24" r="6" class="rust"/><circle cx="46" cy="24" r="6" class="gold"/><circle cx="66" cy="24" r="6" class="teal"/>
        <text x="24" y="70" class="mono" font-size="17" fill="#f5efe6" font-weight="700">3Sum</text>
        <text x="24" y="102" class="mono" font-size="14" fill="#e07a52">in  <tspan fill="#f5efe6">nums = [-1,0,1,2,-1,-4]</tspan></text>
        <text x="24" y="126" class="mono" font-size="14" fill="#e07a52">out <tspan fill="#f5efe6">[[-1,-1,2],[-1,0,1]]</tspan></text>
        <text x="24" y="166" class="mono" font-size="14" fill="#7fc9a2">✓ 3 of 3 sample tests passed</text>
        <rect x="24" y="184" width="10" height="18" fill="#f5efe6" class="caret"/>
      </g>
    </g>
    <!-- middle: lesson with the reading bar -->
    <g class="f2">
      <g transform="translate(60 120)">
        <rect x="10" y="10" width="380" height="210" rx="18" class="ink"/>
        <rect width="380" height="210" rx="18" class="card" stroke="#191614" stroke-width="4"/>
        <text x="24" y="40" class="text ink" font-size="14" fill-opacity=".55" font-weight="600">DSA Fundamentals · 2/47</text>
        <text x="236" y="40" class="text ink" font-size="14" fill-opacity=".55">54% read · 10 min</text>
        <rect x="0" y="56" width="380" height="5" class="ink" fill-opacity=".1"/>
        <rect x="0" y="56" width="380" height="5" class="rust bar"/>
        <text x="24" y="108" class="display ink" font-size="34" textLength="230" lengthAdjust="spacingAndGlyphs">BIG-O NOTATION</text>
        <rect x="24" y="126" width="300" height="9" rx="4.5" class="ink" fill-opacity=".14"/>
        <rect x="24" y="144" width="260" height="9" rx="4.5" class="ink" fill-opacity=".14"/>
        <rect x="24" y="168" width="332" height="26" rx="8" fill="#ece3d4"/>
        <text x="36" y="186" class="text" font-size="13" font-weight="700" fill="#a34a28">Quick check · Simplify O(5n² + 100n log n + 1000)</text>
      </g>
    </g>
    <!-- front: company rounds -->
    <g class="f1">
      <g transform="translate(0 250)">
        <rect x="10" y="10" width="330" height="190" rx="18" class="ink"/>
        <rect width="330" height="190" rx="18" class="card" stroke="#191614" stroke-width="4"/>
        <text x="22" y="34" class="mono" font-size="12" fill="#a34a28" letter-spacing="1.5">PRODUCT MNC · SDE-1</text>
        <text x="22" y="74" class="display ink" font-size="34" textLength="112" lengthAdjust="spacingAndGlyphs">AMAZON</text>
        <rect x="236" y="20" width="76" height="28" rx="7" class="card" stroke="#191614" stroke-width="2.5"/>
        <text x="246" y="40" class="cond ink" font-size="15">3 ROUNDS</text>
        <text x="22" y="108" class="mono" font-size="14" fill="#a34a28">01</text><text x="52" y="108" class="text ink" font-size="15" font-weight="600">OA: coding + survey</text>
        <text x="22" y="134" class="mono" font-size="14" fill="#a34a28">02</text><text x="52" y="134" class="text ink" font-size="15" font-weight="600">DSA + object design</text>
        <text x="22" y="160" class="mono" font-size="14" fill="#a34a28">03</text><text x="52" y="160" class="text ink" font-size="15" font-weight="600">Bar raiser round</text>
        <g class="pulse"><rect x="250" y="160" width="58" height="8" rx="4" class="rust"/></g>
      </g>
    </g>
  </g>

  <!-- a dashed orbit tying the deck together -->
  <path d="M640 470 C 820 520, 1120 500, 1230 380" class="line orbit" stroke-opacity=".35"/>
  <rect x="0" y="512" width="1280" height="8" class="ink"/>
</svg>
